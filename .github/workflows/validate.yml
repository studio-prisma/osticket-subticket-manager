name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC: catches PHP and Composer drift on an unchanged repo.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none

      - name: Syntax check all production files
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" || fail=1
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './tests/*' -print0)
          exit "$fail"

  test:
    name: PHPUnit (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPUnit
        run: vendor/bin/phpunit --testdox

  package:
    name: Release package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install runtime dependencies only
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      # Same script as the release workflow. It fails when .releaseinclude lists
      # a file that does not exist or misses a class under src/, so a forgotten
      # entry turns the pull request red instead of the next release.
      - name: Build the install package
        run: ./tools/build-zip.sh

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        uses: raven-actions/actionlint@v2

  # Single aggregating context for the branch ruleset. Required-status-check
  # names are job names, and the matrix jobs produce one name per PHP version,
  # which would have to be re-registered on every version bump. This job is the
  # only context the ruleset knows about; the matrix can change freely underneath.
  # `if: always()` is mandatory: without it the job is skipped when a dependency
  # fails, the required context stays pending and the pull request hangs instead
  # of turning red.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [lint, test, package, actionlint]
    if: always()
    steps:
      - name: Fail unless every job succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "package=${{ needs.package.result }}"
          echo "actionlint=${{ needs.actionlint.result }}"
          exit 1
