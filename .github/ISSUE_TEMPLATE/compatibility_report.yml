name: Compatibility report
description: Report the plugin working (or breaking) on a version combination not listed yet
labels: ["compatibility"]
body:
  - type: input
    id: osticket-version
    attributes:
      label: osTicket version
      placeholder: "1.18.3"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4.2"
    validations:
      required: true

  - type: input
    id: database
    attributes:
      label: Database server and table prefix
      placeholder: "MySQL 8.0, prefix ost_"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "2.0.7"
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works, including link/unlink as a non-admin agent
        - Works, only tested as admin
        - Partially broken
        - Does not work
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Which areas did you test (panel, queue icon, hand-off, admin overview, uninstall), and what did you observe?
    validations:
      required: true
